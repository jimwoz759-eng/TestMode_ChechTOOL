name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Nuitka
        run: pip install nuitka ordered-set zstandard
      - name: Build exe with Nuitka (request admin elevation via UAC)
        run: python -m nuitka --onefile --assume-yes-for-downloads --windows-uac-admin --output-dir=dist --output-filename=TestMode_Check.exe check_bcdedit.py
      - uses: actions/upload-artifact@v4
        with:
          name: TestMode_Check-windows
          path: dist/TestMode_Check.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Windows Build
          files: dist/TestMode_Check.exe
